<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Зрилоуловитель 3000</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://github.com/tmijs/tmi.js/releases/download/v1.8.5/tmi.min.js"></script>
    <script>
        (function() {
            const ts = Date.now();
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `style.css?t=${ts}`;
            document.head.appendChild(link);
        })();
    </script>
</head>

<body>
    <div class="logo">🤖 Зрилоуловитель 3000</div>
    <div class="panel">
        <div class="info">
            <div>Status: <span id="status" style="color:orange">Connecting...</span></div>
            <div class="new-viewers">Новеньких за 24 часа: <span id="new-viewers"></span></div>
        </div>
        <div class="panel-actions">
            <details class="settings">
                <summary>Настройки</summary>
                <label>
                    Канал
                    <input id="twitchChannel" type="text" placeholder="название канала" autocomplete="off" spellcheck="false">
                </label>
                <label>
                    Показывать только новых
                    <input id="onlyNewViewers" type="checkbox">
                </label>
                <label>
                    Ников в ленте
                    <input id="viewerFeedLimit" type="number" min="1" max="500" step="1">
                </label>
                <label>
                    Размер аватарки
                    <span class="input-with-unit">
                        <input id="avatarSize" type="number" min="32" max="300" step="1">
                        <span>px</span>
                    </span>
                </label>
            </details>
            <button id="clearBtn" class="clear-db-button">Clear Viewers DB</button>
        </div>
    </div>
    <div id="viewers"></div>
    <div id="log"></div>
    <div class="channel">Канал: <span id="channel"></span></div>
    <!-- Динамическая загрузка скриптов с cache-busting -->
    <script>
        (function() {
            const ts = Date.now();
            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `${src}?t=${ts}`;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.body.appendChild(script);
                });
            }

            loadScript('config.js')
                .catch((err) => {
                    console.warn('config.js не загружен, используются значения по умолчанию:', err);
                })
                .finally(() => {
                    loadScript('script.js').catch((err) => {
                        console.error('Ошибка загрузки script.js:', err);
                    });
                });
        })();
    </script>
</body>

</html>
