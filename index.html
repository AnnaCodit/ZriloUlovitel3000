<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Зрилоуловитель 3000</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://github.com/tmijs/tmi.js/releases/download/v1.8.5/tmi.min.js"></script>
    <script>
        (function () {
            const version = Date.now();
            const withVersion = (file) => `${file}?v=${version}`;
            const cssFiles = ['style.css'];
            cssFiles.forEach((file) => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = withVersion(file);
                link.addEventListener('error', () => {
                    console.error(`[Asset Loader] Failed to load CSS: ${file}`);
                });
                document.head.appendChild(link);
            });
        })();
    </script>
</head>

<body>
    <div class="panel">
        <div class="logo">🤖 Зрилоуловитель 3000</div>
        <div class="header-right">
            <div class="new-viewers">Новеньких за 24 часа: <span id="new-viewers"></span></div>
            <button id="settingsToggleBtn" class="settings-toggle-btn" type="button" title="Настройки" aria-label="Настройки">⚙️</button>
        </div>
    </div>
    <div id="panelActions" class="panel-actions">
        <div class="settings">
            <div class="settings-title">⚙️ Настройки</div>
            <label> Канал <input id="twitchChannel" type="text" placeholder="название канала" autocomplete="off"
                    spellcheck="false">
            </label>
            <label> Показывать только новых <input id="onlyNewViewers" type="checkbox">
            </label>
            <label> Порог рейда (чел) <input id="raidThreshold" type="number" min="2" max="100" step="1">
            </label>
            <label> Ников в ленте <input id="viewerFeedLimit" type="number" min="1" max="500" step="1">
            </label>
            <label>
                Размер аватарки
                <span class="input-with-unit">
                    <input id="avatarSize" type="number" min="32" max="300" step="1">
                    <span>px</span>
                </span>
            </label>
            <button id="saveSettingsBtn" class="save-settings-button">Сохранить</button>
        </div>
    </div>
    <div id="viewers"></div>
    <div class="footer">
        <div class="channel">Канал: <span id="channel"></span></div>
        <div class="status-block">Status: <span id="status" style="color:orange">Connecting...</span></div>
        <div class="footer-actions">
            <button id="clearBtn" class="clear-db-button">Clear Viewers DB</button>
        </div>
    </div>
    <!-- Динамическое подключение локальных скриптов с cache-busting -->
    <script>
        (function () {
            const version = Date.now();
            const withVersion = (file) => `${file}?v=${version}`;

            // Порядок зависимостей: script.js выполняется после config.js
            const jsFiles = [
                'config.js',
                'script.js'
            ];

            jsFiles.forEach((file) => {
                const script = document.createElement('script');
                script.src = withVersion(file);
                // Сохраняем строгий порядок выполнения через async = false
                script.async = false;
                script.addEventListener('error', () => {
                    console.error(`[Asset Loader] Failed to load JavaScript: ${file}`);
                });
                document.body.appendChild(script);
            });

            console.log(`[Asset Loader] Local assets requested with version ${version}.`);
        })();
    </script>
</body>

</html>
